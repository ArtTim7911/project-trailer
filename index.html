<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ігрова подія</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <article class="event-card">
      <img
        class="event-card__image"
        src="./cybersport.jfif"
        alt="Ігровий турнір"
      >

      <div class="event-card__content">
        <h1 class="event-card__title">Cyber Arena Championship</h1>

        <p class="event-card__date">25 жовтня 2026</p>

        <p class="event-card__description">
          Великий ігровий турнір для всіх охочих. Змагайся,
          перемагай та отримуй круті призи!
        </p>

        <p class="event-card__location">
          Київ, GameHub Arena
        </p>

        <a href="#" class="event-card__button">
          Зареєструватися
        </a>
      </div>
    </article>
  </main>

</body>
</html>
